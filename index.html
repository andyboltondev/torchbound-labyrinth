<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="theme-color" content="#0b0d12">
<meta name="description" content="Torchbound Labyrinth -- a procedural Norse dungeon crawler for the browser.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Torchbound Labyrinth</title>
<link rel="stylesheet" href="src/ui/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230b0d12'/><path d='M16 5l3 9h-6z' fill='%23ff8a3a'/><rect x='14.5' y='13' width='3' height='14' fill='%235b4128'/></svg>">
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="Dungeon view"></canvas>

  <div id="hud" class="hud" hidden>
    <div class="hud-top">
      <div class="hud-left">
        <div class="vitals">
          <div class="bar health"><div class="bar-fill" id="healthFill"></div><span id="healthText">100</span></div>
          <div class="chips">
            <span class="chip depth" id="depthChip">Depth I</span>
            <span class="chip ammo" id="ammoChip" hidden><i class="ico-bolt"></i><span id="ammoText">0</span></span>
            <span class="chip keys" id="keysChip" hidden></span>
          </div>
        </div>
      </div>
      <div class="hud-right">
        <div class="score-block">
          <div class="score" id="scoreText">0</div>
          <div class="streak" id="streakBlock" hidden>
            <span id="streakText">x1</span>
            <div class="streak-bar"><div id="streakFill"></div></div>
          </div>
        </div>
        <div class="hud-buttons">
          <button class="icon-btn" id="btnBestiary" title="Bestiary (B)" aria-label="Bestiary">&#9763;</button>
          <button class="icon-btn" id="btnPause" title="Pause (Esc)" aria-label="Pause">&#10073;&#10073;</button>
        </div>
      </div>
    </div>

    <div class="hazard-banner" id="hazardBanner" hidden>
      <strong id="hazardName"></strong><span id="hazardHint"></span>
    </div>

    <div class="boss-bar" id="bossBar" hidden>
      <div class="boss-name" id="bossName"></div>
      <div class="boss-track"><div class="boss-fill" id="bossFill"></div></div>
    </div>

    <div class="toast-stack" id="toastStack"></div>

    <div class="action-prompt" id="actionPrompt" hidden>
      <span class="key-cap" id="actionKey">E</span>
      <span class="action-label" id="actionLabel"></span>
      <span class="action-hint" id="actionHint"></span>
    </div>
  </div>

  <div id="touch" class="touch" hidden>
    <div class="dpad" id="dpad" aria-label="Movement">
      <div class="dpad-base"></div>
      <div class="dpad-stick" id="dpadStick"></div>
    </div>
    <div class="buttons">
      <button class="tbtn action" data-action="action" aria-label="Action">ACT</button>
      <button class="tbtn fire" data-action="fire" id="touchFire" aria-label="Fire crossbow" hidden>FIRE</button>
      <button class="tbtn slash" data-action="slash" aria-label="Slash">SLASH</button>
    </div>
  </div>

  <div id="screens"></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
