<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="theme-color" content="#0b0d12">
<meta name="description" content="Torchbound Labyrinth -- a procedural Norse dungeon crawler for the browser.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Torchbound Labyrinth</title>
<link rel="stylesheet" href="src/ui/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230b0d12'/><path d='M16 5l3 9h-6z' fill='%23ff8a3a'/><rect x='14.5' y='13' width='3' height='14' fill='%235b4128'/></svg>">
</head>
<body>
<div id="app">
  <canvas id="game" role="img"
    aria-label="Isometric view of the labyrinth. Torchlight reveals the stone nearby; explored passages linger as fading memory."></canvas>

  <div id="hud" class="hud" hidden>
    <div class="hud-top">
      <div class="hud-left">
        <div class="vitals">
          <div class="bar health" id="healthMeter" role="meter" aria-label="Vitality"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" aria-valuetext="100 of 100">
            <div class="bar-fill" id="healthFill"></div><span id="healthText">100</span>
          </div>
          <div class="objective" id="objective" aria-live="polite" hidden>
            <i class="obj-dot" id="objectiveDot" aria-hidden="true"></i><span id="objectiveText"></span>
          </div>
          <div class="hazard-chip" id="hazardChip" hidden>
            <i class="hz-dot" id="hazardDot" aria-hidden="true"></i>
            <b id="hazardChipName"></b><span id="hazardChipHint"></span>
          </div>
          <div class="chips">
            <span class="chip depth" id="depthChip">Depth I</span>
            <span class="chip time" id="timeChip" hidden>
              <i class="ico-glass" aria-hidden="true"></i>
              <span id="timeText">0:00</span><small id="timeParText"></small>
            </span>
            <span class="chip ammo" id="ammoChip" hidden><i class="ico-bolt" aria-hidden="true"></i><span id="ammoText">0</span></span>
            <span class="chip keys" id="keysChip" role="list" aria-label="Keys held" hidden></span>
          </div>
        </div>
      </div>
      <div class="hud-right">
        <div class="score-block">
          <div class="score" id="scoreText" aria-label="Score">0</div>
          <div class="streak" id="streakBlock" hidden>
            <span id="streakText">x1</span>
            <div class="streak-bar"><div id="streakFill"></div></div>
          </div>
        </div>
        <div class="hud-buttons">
          <button class="icon-btn" id="btnBestiary" data-label="Bestiary" title="Bestiary (B)" aria-label="Open the bestiary">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 2C7.6 2 4 5.4 4 9.6c0 2.4 1.1 4.3 2.9 5.6.4.3.6.7.6 1.2v1.1c0 .8.7 1.5 1.5 1.5h6c.8 0 1.5-.7 1.5-1.5v-1.1c0-.5.2-.9.6-1.2 1.8-1.3 2.9-3.2 2.9-5.6C20 5.4 16.4 2 12 2Zm-3.2 9.4a2 2 0 1 1 0-4 2 2 0 0 1 0 4Zm6.4 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4ZM12 12.6l1.2 2.4h-2.4L12 12.6ZM9 20h2v2H9v-2Zm4 0h2v2h-2v-2Z"/>
            </svg>
          </button>
          <button class="icon-btn" id="btnPause" data-label="Pause" title="Pause (Esc)" aria-label="Pause the game">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="6.5" y="4.5" width="4" height="15" rx="1"/><rect x="13.5" y="4.5" width="4" height="15" rx="1"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="hazard-banner" id="hazardBanner" role="status" hidden>
      <strong id="hazardName"></strong><span id="hazardHint"></span>
    </div>

    <div class="boss-bar" id="bossBar" hidden>
      <div class="boss-name" id="bossName"></div>
      <div class="boss-track" id="bossMeter" role="meter" aria-label="Great foe"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div class="boss-fill" id="bossFill"></div></div>
    </div>

    <div class="toast-stack" id="toastStack" role="status" aria-live="polite"></div>

    <div class="action-prompt" id="actionPrompt" hidden>
      <span class="key-cap" id="actionKey">E</span>
      <span class="action-label" id="actionLabel"></span>
      <span class="action-hint" id="actionHint"></span>
    </div>
  </div>

  <div id="touch" class="touch" hidden>
    <!-- Two movement surfaces, one shown at a time (Settings > Touch pad).
         The diamond is the default: rotated 45 degrees, its four buttons sit
         on the screen diagonals, which is exactly where the isometric view
         draws the four dungeon axes. -->
    <div class="dpad-zone" id="dpadZone" aria-label="Movement area" hidden>
      <div class="dpad" id="dpad">
        <div class="dpad-base"></div>
        <div class="dpad-stick" id="dpadStick"></div>
      </div>
    </div>
    <div class="diamond" id="diamond" role="group" aria-label="Movement pad" hidden>
      <button class="dbtn north" data-dir="north" type="button" aria-label="Walk north">
        <i class="dbtn-arrow" aria-hidden="true"></i><em>N</em>
      </button>
      <button class="dbtn east" data-dir="east" type="button" aria-label="Walk east">
        <i class="dbtn-arrow" aria-hidden="true"></i><em>E</em>
      </button>
      <button class="dbtn south" data-dir="south" type="button" aria-label="Walk south">
        <i class="dbtn-arrow" aria-hidden="true"></i><em>S</em>
      </button>
      <button class="dbtn west" data-dir="west" type="button" aria-label="Walk west">
        <i class="dbtn-arrow" aria-hidden="true"></i><em>W</em>
      </button>
      <span class="diamond-hub" aria-hidden="true"></span>
    </div>
    <div class="buttons">
      <button class="tbtn torch" data-action="torch" type="button" aria-label="Put out or relight your torch">TORCH</button>
      <button class="tbtn action" data-action="action" type="button" aria-label="Act on what is in front of you">ACT</button>
      <button class="tbtn fire" data-action="fire" id="touchFire" type="button" aria-label="Loose a crossbow bolt" hidden>FIRE</button>
      <button class="tbtn slash" data-action="slash" type="button" aria-label="Slash with the sword">SLASH</button>
    </div>
  </div>

  <div id="screens"></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
